 <label for="usuario">Usuario:</label>
 <input type="text" id="usuario" autocomplete="off" />
 </div>
 <div class="fila-campo">
 <label for="clave">Contraseña:</label>

 </div>

 <button type="button" class="boton-sistema">Cancelar</button>
 </div>
 </form>
 </div>
</div>
